name: Keepalive HogarQuest

# Mantiene despierto el servidor gratuito (SnapDeploy) cada 5 minutos.
# GitHub Actions es gratis e ilimitado en repositorios públicos.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

env:
  SERVER_URL: ${{ vars.SERVER_URL || 'https://hogarquest-75f7c.containers.snapdeploy.app' }}
  SUBDOMAIN: hogarquest-75f7c

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar el contenedor (API publica de SnapDeploy)
        run: |
          curl -s -X POST -m 30 "https://snapdeploy.dev/api/public/wake/$SUBDOMAIN" > /dev/null || true
      - name: Comprobar el servidor
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$SERVER_URL/health" || echo 000)
            echo "intento $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Servidor despierto."
              exit 0
            fi
            sleep 25
          done
          echo "No respondio; se reintentara en la proxima ejecucion."
          exit 0