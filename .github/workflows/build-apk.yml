name: Build APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - run: flutter pub get
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64,android-arm,android-x86_64 --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} 2>&1 | tee /tmp/build.log
      - name: Report build error
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$(tail -n 150 /tmp/build.log)"
          EXISTING=$(gh issue list --state open --search "APK build failure" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "APK build failure" --body "$BODY"
          fi
      - name: Upload to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          name: HogarQuest APK
          tag_name: ${{ github.ref_name }}
          body: 'APK compilada automáticamente. Instala en Android.'
          overwrite: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
