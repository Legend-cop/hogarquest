app = "hogarquest"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  WEB_ROOT = "/app/web"
  DATA_FILE = "/data/hogarquest_data.json"
  FOTOS_DIR = "/data/fotos"

[mounts]
  source = "hogarquest_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
